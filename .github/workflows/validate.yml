name: JEFEAGUILA CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jefeaguila-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python, Node, configuration and installer checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: "22"

      - name: Install pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q jefeaguila examples tests

      - name: Validate JSON configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path("config/jefeaguila.json"), Path("config/communication.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Valid JSON: {path}")
          PY

      - name: Run unit and repository tests
        run: python -m unittest discover -s tests -v

      - name: Verify module registry CLI
        run: python -m jefeaguila.cli status

      - name: Check Node.js client syntax
        run: npm run check

      - name: Check Ubuntu installer syntax
        run: bash -n scripts/install_ubuntu.sh
